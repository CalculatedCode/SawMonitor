plugins {
    id 'com.android.application'
}

android {
    namespace 'com.calculatedcode.sawmonitor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.calculatedcode.sawmonitor'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '1.3'
    }

    signingConfigs {
        debug {
            storeFile file('../ci/sawmonitor-debug.keystore')
            storePassword 'sawmonitor'
            keyAlias 'sawmonitor'
            keyPassword 'sawmonitor'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
