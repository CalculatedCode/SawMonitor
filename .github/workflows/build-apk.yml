name: Build SawMonitor APK
# v1.2 level-only monitor build fixed

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - '*.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android platform
        run: /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk SawMonitor.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" verify --verbose SawMonitor.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/aapt" dump badging SawMonitor.apk | head -20
          ls -lh SawMonitor.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SawMonitor-APK
          path: SawMonitor.apk
          if-no-files-found: error
          retention-days: 14
